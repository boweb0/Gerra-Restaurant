<style>
:root{
  --palm:#0C2419; --palm-2:#123324; --palm-3:#1B4631;
  --saffron:#F0A93B; --saffron-2:#FFD27A; --clay:#C2582F; --sand:#F5E8CF; --muted:#A9BDAF;
  --wa:#1FAF5A; --ink:#F7EEDB;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Almarai',system-ui,sans-serif;background:var(--palm);color:var(--ink);line-height:1.85;font-size:16.5px;overflow-x:hidden}
h1,h2,h3{font-family:'Rakkas','Almarai',serif;font-weight:400;line-height:1.35}
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3{font-family:'Almarai',sans-serif;font-weight:800;letter-spacing:-.01em}
a{color:inherit}button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saffron-2);outline-offset:3px}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto}
body::before{content:"";position:fixed;inset:0;z-index:-1;opacity:.5;
  background:
   radial-gradient(900px 600px at 85% -10%,rgba(240,169,59,.16),transparent 60%),
   radial-gradient(700px 500px at 0% 90%,rgba(194,88,47,.14),transparent 60%)}

header{position:fixed;inset-inline:0;top:0;z-index:40;transition:.3s;border-bottom:1px solid transparent}
header.solid{background:rgba(12,36,25,.86);backdrop-filter:blur(12px);border-color:rgba(245,232,207,.12)}
header .wrap{display:flex;justify-content:space-between;align-items:center;height:70px;gap:12px}
.brand{font-family:'Rakkas';font-size:1.8rem;color:var(--saffron);text-decoration:none;line-height:1}
html[lang="en"] .brand{font-family:'Almarai';font-weight:800;font-size:1.3rem}
nav{display:flex;gap:24px;font-size:.95rem}nav a{text-decoration:none;color:var(--muted)}nav a:hover{color:var(--saffron-2)}
.tools{display:flex;gap:10px;align-items:center}
.pill{border:1.5px solid rgba(245,232,207,.3);background:transparent;border-radius:999px;padding:7px 16px;cursor:pointer;font-size:.88rem;transition:.2s}
.pill:hover{background:rgba(245,232,207,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--wa);color:#fff;border:0;border-radius:14px;padding:13px 26px;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(31,175,90,.35)}
.btn.sf{background:var(--saffron);color:#2a1604}.btn.sf:hover{box-shadow:0 12px 28px rgba(240,169,59,.4)}
.btn.sm{padding:8px 16px;font-size:.88rem;border-radius:10px}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;overflow:hidden;padding-top:70px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:20px}
.hero h1{font-size:clamp(3rem,8.4vw,6.8rem);color:var(--ink);line-height:1.15;margin-bottom:16px}
.hero h1 b{display:block;color:var(--saffron);font-weight:400}
.hero h1 .w{display:inline-block;opacity:0;transform:translateY(40px) rotate(2deg);animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.hero p.lead{max-width:36ch;color:var(--muted);font-size:1.12rem;margin-bottom:28px;opacity:0;animation:rise 1s .6s forwards}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;opacity:0;animation:rise 1s .85s forwards}
.hours{margin-top:26px;color:var(--muted);font-size:.92rem;opacity:0;animation:rise 1s 1.05s forwards}
.stage{position:relative;aspect-ratio:1;max-width:520px;margin-inline:auto;width:100%}
.plate{position:absolute;inset:0;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.steam{position:absolute;inset-inline:0;top:-8%;height:40%;pointer-events:none}
.steam path{fill:none;stroke:rgba(247,238,219,.5);stroke-width:4;stroke-linecap:round;stroke-dasharray:220;stroke-dashoffset:220;animation:st 5.5s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:1.5s}.steam path:nth-child(3){animation-delay:3s}
@keyframes st{0%{stroke-dashoffset:220;opacity:0}25%{opacity:1}100%{stroke-dashoffset:-220;opacity:0}}
.ring-text{position:absolute;inset:-4%;width:108%;height:108%;animation:spin 40s linear infinite reverse;pointer-events:none}

.marq{background:var(--saffron);color:#2a1604;overflow:hidden;white-space:nowrap;border-block:2px solid #2a1604}
.marq div{display:inline-flex;gap:44px;padding:11px 0;animation:mq 34s linear infinite;font-family:'Rakkas';font-size:1.4rem}
html[lang="en"] .marq div{font-family:'Almarai';font-weight:800;font-size:1rem}
@keyframes mq{to{transform:translateX(50%)}}
html[dir="ltr"] .marq div{animation-name:mq2}@keyframes mq2{to{transform:translateX(-50%)}}

section{padding:90px 0}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.sec-h h2{font-size:clamp(2.1rem,4.6vw,3.5rem);color:var(--saffron)}
.sec-h p{color:var(--muted);max-width:46ch}

/* menu */
.tabs{position:sticky;top:70px;z-index:20;background:rgba(12,36,25,.92);backdrop-filter:blur(10px);margin-inline:-16px;padding:12px 16px;display:flex;gap:8px;overflow-x:auto;border-block:1px solid rgba(245,232,207,.1)}
.tab{position:relative;white-space:nowrap;padding:9px 20px;border-radius:999px;border:1.5px solid var(--palm-3);background:var(--palm-2);cursor:pointer;transition:.25s;font-weight:700}
.tab:hover{border-color:var(--saffron)}
.tab.on{background:var(--saffron);color:#2a1604;border-color:var(--saffron);transform:translateY(-1px)}
.cat-t{font-size:2rem;margin:38px 0 14px;display:flex;align-items:center;gap:14px}
.cat-t::after{content:"";height:2px;flex:1;background:linear-gradient(90deg,var(--clay),transparent)}
html[dir="rtl"] .cat-t::after{background:linear-gradient(270deg,var(--clay),transparent)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;background:var(--palm-2);border:1px solid rgba(245,232,207,.1);border-radius:18px;padding:14px 16px;opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s,border-color .25s}
.item.in{opacity:1;transform:none}
.item:hover{border-color:var(--saffron)}
.ic{width:64px;height:64px;border-radius:16px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.14),transparent 60%),var(--palm-3);display:grid;place-items:center}
.ic svg{width:38px;height:38px}
.item h3{font-family:'Almarai';font-weight:800;font-size:1.05rem;line-height:1.4}
.item .pr{color:var(--saffron-2);font-weight:800}
.item .pr small{color:var(--muted);font-weight:400;font-size:.76rem;margin-inline-start:6px}
.item.off{opacity:.45;filter:grayscale(.6)}
.qty{display:flex;align-items:center;gap:8px}
.qb{width:34px;height:34px;border-radius:50%;border:0;background:var(--saffron);color:#2a1604;font-weight:800;font-size:1.2rem;cursor:pointer;transition:transform .15s}
.qb:active{transform:scale(.88)}
.qb.minus{background:var(--palm-3);color:var(--ink)}
.qn{min-width:18px;text-align:center;font-weight:800}
.soldout{font-size:.8rem;color:var(--muted)}

/* tray */
.tray{position:fixed;inset-inline:0;bottom:0;z-index:50;transform:translateY(110%);transition:transform .45s cubic-bezier(.2,.8,.2,1);background:var(--palm-2);border-top:2px solid var(--saffron);box-shadow:0 -20px 50px rgba(0,0,0,.5)}
.tray.on{transform:none}
.tray .wrap{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap}
.tray b{font-size:1.15rem}.tray small{color:var(--muted);display:block;line-height:1.4}
.bump{animation:bump .4s}@keyframes bump{40%{transform:scale(1.06)}}

/* QR + pitch */
.qr{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;background:linear-gradient(135deg,var(--palm-2),var(--palm-3));border:1px solid rgba(245,232,207,.14);border-radius:28px;padding:34px}
.qrbox{background:#fff;border-radius:18px;padding:14px;width:170px;height:170px;display:grid;place-items:center}
.qrbox canvas,.qrbox img{width:100%!important;height:100%!important}
.qr h2{font-size:2.2rem;color:var(--saffron);margin-bottom:6px}
.qr p{color:var(--muted);max-width:46ch}
.pitch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:40px}
.feat{border-top:2px solid var(--clay);padding:16px 2px 0}
.feat h3{font-size:1.55rem;color:var(--saffron);margin-bottom:2px}.feat p{color:var(--muted)}

footer{padding:56px 0 110px;border-top:1px solid rgba(245,232,207,.12)}
footer .wrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center}
footer h2{font-size:2rem;color:var(--saffron)}footer p{color:var(--muted)}
.note{width:100%;text-align:center;font-size:.8rem;color:var(--muted);opacity:.7;margin-top:30px}

.fab{position:fixed;inset-inline-end:16px;bottom:16px;z-index:45;display:flex;flex-direction:column;gap:10px;align-items:flex-end;transition:bottom .4s}
.fab.up{bottom:96px}
.fab .adm{background:var(--saffron);color:#2a1604;border:0;border-radius:999px;padding:11px 18px;font-weight:800;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.5)}
.fab .wa{width:56px;height:56px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 10px 28px rgba(0,0,0,.5)}.fab .wa svg{width:28px;height:28px}

.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(520px,100%);background:#0d2a1d;z-index:90;transform:translateX(102%);transition:transform .45s cubic-bezier(.2,.8,.2,1);border-inline-end:1px solid rgba(245,232,207,.2);display:flex;flex-direction:column}
html[dir="ltr"] .drawer{transform:translateX(-102%)}html .drawer.open{transform:none}
.dh{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(245,232,207,.14)}
.dh h2{font-size:1.7rem;color:var(--saffron)}
.drawer .body{padding:16px 20px;overflow:auto;flex:1}
.hint{background:rgba(240,169,59,.12);border:1px solid rgba(240,169,59,.4);border-radius:12px;padding:10px 14px;font-size:.88rem;margin-bottom:14px}
.arow{display:grid;grid-template-columns:1fr 88px auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(245,232,207,.1)}
.arow input[type=text],.arow input[type=number]{width:100%;background:var(--palm-3);color:var(--ink);border:1px solid #2b5a43;border-radius:8px;padding:7px 10px;font:inherit;font-size:.92rem}
.arow label{grid-column:1/-1;display:flex;gap:6px;align-items:center;font-size:.82rem;color:var(--muted)}
.drawer .foot{padding:14px 20px;border-top:1px solid rgba(245,232,207,.14);display:flex;gap:10px;flex-wrap:wrap}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:85;opacity:0;pointer-events:none;transition:opacity .3s}.scrim.on{opacity:1;pointer-events:auto}
.toast{position:fixed;bottom:100px;inset-inline-start:50%;transform:translate(-50%,40px);background:var(--saffron);color:#2a1604;padding:10px 20px;border-radius:999px;z-index:95;opacity:0;transition:.35s;font-weight:800}.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  nav{display:none}
  .hero .wrap{grid-template-columns:1fr}.stage{max-width:320px;order:-1}.hero{padding-top:90px}
  .qr{grid-template-columns:1fr;justify-items:start}
  .item{grid-template-columns:56px 1fr}.item .qty{grid-column:1/-1;justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero h1 .w,.hero p.lead,.hero .cta,.hours,.item{opacity:1;transform:none}}
</style>
</head>

en:{brand:"Gerra Restaurant",n1:"Menu",n2:"QR code",n3:"Your real site",n4:"Contact",wa:"WhatsApp",

const SEED=[
 {id:1,c:"br",ar:"فول بالزيت والطماطم",en:"Fava beans with oil & tomato",p:12,on:true,ic:"bowl"},
 {id:2,c:"br",ar:"شكشوكة",en:"Shakshuka",p:18,on:true,ic:"pan"},
 {id:3,c:"br",ar:"حمص بالطحينة",en:"Hummus with tahini",p:14,on:true,ic:"bowl"},
 {id:4,c:"mn",ar:"كبسة لحم",en:"Lamb kabsa",p:48,on:true,ic:"plate"},
 {id:5,c:"mn",ar:"مندي دجاج",en:"Chicken mandi",p:38,on:true,ic:"plate"},
 {id:6,c:"mn",ar:"مظبي لحم",en:"Lamb mathbi",p:55,on:true,ic:"plate"},
 {id:7,c:"mn",ar:"هريس",en:"Harees",p:32,on:false,ic:"bowl"},
 {id:8,c:"gr",ar:"مشاوي مشكلة",en:"Mixed grill",p:65,on:true,ic:"grill"},
 {id:9,c:"gr",ar:"ريش غنم",en:"Lamb ribs",p:58,on:true,ic:"grill"},
 {id:10,c:"st",ar:"شوربة عدس",en:"Lentil soup",p:14,on:true,ic:"bowl"},
 {id:11,c:"st",ar:"سلطة فتوش",en:"Fattoush salad",p:16,on:true,ic:"leaf"},
 {id:12,c:"ds",ar:"كليجا بالتمر",en:"Dates kleija",p:15,on:true,ic:"cup"},
 {id:13,c:"ds",ar:"شاي كرك",en:"Karak tea",p:8,on:true,ic:"cup"}
];
const IC={
 plate:'<circle cx="19" cy="19" r="15"/><circle cx="19" cy="19" r="9"/>',
 bowl:'<path d="M4 17h30c0 10-6 16-15 16S4 27 4 17z"/><path d="M12 11c0-3 3-3 3-6M20 11c0-3 3-3 3-6"/>',
 pan:'<circle cx="17" cy="20" r="12"/><path d="M29 20h8"/>',
 grill:'<path d="M5 12h28M5 19h28M5 26h28M9 8v22M29 8v22"/>',
 leaf:'<path d="M6 32C6 14 18 6 34 6c0 16-8 28-28 26zM6 32l16-16"/>',
 cup:'<path d="M7 12h20v12a8 8 0 01-8 8h-4a8 8 0 01-8-8zM27 15h3a4 4 0 010 8h-3"/>'
};
const store={get(){try{const v=localStorage.getItem("gerra_demo");return v?JSON.parse(v):null}catch(e){return null}},set(v){try{localStorage.setItem("gerra_demo",JSON.stringify(v))}catch(e){}},clear(){try{localStorage.removeItem("gerra_demo")}catch(e){}}};
let data=store.get()||JSON.parse(JSON.stringify(SEED)), lang="ar", cart={}, active="br";
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),t=k=>T[lang][k];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm=d=>lang==="ar"?d.ar:(d.en||d.ar);

function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  $("#lang").textContent=lang==="ar"?"EN":"عربي";document.title=t("brand");
  $$("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  const h=t("h1");$("#h1").innerHTML=h.map((w,i)=>(i===h.length-1?'<b>':"")+'<span class="w" style="animation-delay:'+(i*.14)+'s">'+w+'</span>'+(i===h.length-1?'</b>':" ")).join("");
  $$("[data-wa]").forEach(a=>{a.href=go(t("hello"));a.target="_blank";a.rel="noopener"});
  const names=SEED.slice(3,9).map(nm);$("#marq").innerHTML=Array(6).fill(names.map(n=>"<span>"+n+"</span><span>✦</span>").join("")).join("");
  renderMenu();renderAdmin();updateTray();
}
function renderMenu(){
  const cats=Object.keys(T[lang].cats);
  $("#tabs").innerHTML=cats.map(k=>'<button class="tab'+(k===active?" on":"")+'" data-k="'+k+'">'+T[lang].cats[k]+'</button>').join("");
  $$("#tabs .tab").forEach(b=>b.onclick=()=>{active=b.dataset.k;renderMenu();const el=document.getElementById("cat-"+active);if(el)window.scrollTo({top:el.getBoundingClientRect().top+scrollY-130,behavior:"smooth"})});
  $("#menuBody").innerHTML=cats.map(k=>{
    const its=data.filter(d=>d.c===k);if(!its.length)return"";
    return '<h3 class="cat-t" id="cat-'+k+'">'+T[lang].cats[k]+'</h3><div class="items">'+its.map(d=>{
      const q=cart[d.id]||0;
      return '<article class="item'+(d.on?"":" off")+'" data-id="'+d.id+'"><div class="ic"><svg viewBox="0 0 38 38" fill="none" stroke="#F0A93B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+(IC[d.ic]||IC.plate)+'</svg></div>'
       +'<div><h3>'+esc(nm(d))+'</h3><div class="pr">'+Number(d.p||0)+' '+t("sar")+'<small>'+t("demo")+'</small></div></div>'
       +(d.on?'<div class="qty"><button class="qb minus" aria-label="-">−</button><span class="qn">'+q+'</span><button class="qb plus" aria-label="+">+</button></div>':'<div class="soldout">'+t("off")+'</div>')+'</article>';
    }).join("")+'</div>';
  }).join("");
  $$(".item").forEach(el=>{const id=el.dataset.id;
    const p=el.querySelector(".plus"),m=el.querySelector(".minus");
    if(p){p.onclick=()=>{cart[id]=(cart[id]||0)+1;el.querySelector(".qn").textContent=cart[id];updateTray(true)};
          m.onclick=()=>{if(cart[id]){cart[id]--;if(!cart[id])delete cart[id];el.querySelector(".qn").textContent=cart[id]||0;updateTray(true)}}}
  });
  observe();
}
function updateTray(bump){
  const ids=Object.keys(cart),count=ids.reduce((a,i)=>a+cart[i],0);
  $("#tray").classList.toggle("on",count>0);$("#fab").classList.toggle("up",count>0);
  const tn=$("#trayN");tn.textContent=t("n")(count);if(bump){tn.classList.remove("bump");void tn.offsetWidth;tn.classList.add("bump")}
  const lines=ids.map(i=>{const d=data.find(x=>x.id==i);return d?("• "+nm(d)+" × "+cart[i]):""}).filter(Boolean).join("\n");
  const total=ids.reduce((a,i)=>{const d=data.find(x=>x.id==i);return a+(d?Number(d.p||0)*cart[i]:0)},0);
  $("#send").href=go(count?T[lang].order(lines,total):t("hello"));
}
let io;function observe(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
  $$(".item").forEach((el,i)=>{el.style.transitionDelay=(i%6)*70+"ms";io.observe(el)});
}
function renderAdmin(){
  $("#alist").innerHTML=data.map(d=>'<div class="arow" data-id="'+d.id+'"><input type="text" value="'+esc(nm(d))+'" data-k="n"><input type="number" min="0" value="'+Number(d.p||0)+'" data-k="p"><span class="soldout">'+t("sar")+'</span><label><input type="checkbox" data-k="on" '+(d.on?"checked":"")+'> '+t("avail")+'</label></div>').join("");
  $$("#alist .arow").forEach(r=>{const d=data.find(x=>x.id==r.dataset.id);
    r.querySelectorAll("input").forEach(i=>i.addEventListener("input",()=>{
      const k=i.dataset.k;if(k==="n"){if(lang==="ar")d.ar=i.value;else d.en=i.value}else if(k==="p")d.p=Number(i.value)||0;else d.on=i.checked;
      store.set(data);const y=scrollY;renderMenu();updateTray();window.scrollTo(0,y);toast(t("saved"));
    }))});
}
let tt;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),1200)}

$("#lang").onclick=()=>{lang=lang==="ar"?"en":"ar";applyLang()};
const openD=()=>{$("#drawer").classList.add("open");$("#scrim").classList.add("on")},closeD=()=>{$("#drawer").classList.remove("open");$("#scrim").classList.remove("on")};
$("#open").onclick=openD;$("#open2").onclick=openD;$("#close").onclick=closeD;$("#scrim").onclick=closeD;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeD()});
$("#add").onclick=()=>{data.push({id:Date.now(),c:active,ar:t("newD"),en:t("newD"),p:20,on:true,ic:"plate"});store.set(data);renderMenu();renderAdmin();toast(t("saved"))};
$("#reset").onclick=()=>{store.clear();data=JSON.parse(JSON.stringify(SEED));renderMenu();renderAdmin();updateTray();toast(t("saved"))};
$("#clear").onclick=()=>{cart={};renderMenu();updateTray()};
window.addEventListener("scroll",()=>$("header").classList.toggle("solid",scrollY>40),{passive:true});
// QR (loaded from CDN; the box hides itself if the library is unavailable)
function makeQR(){
  try{ if(!window.QRCode) throw 0; $("#qrbox").innerHTML=""; new QRCode($("#qrbox"),{text:location.href.split("#")[0],width:160,height:160,colorDark:"#0C2419",colorLight:"#ffffff"}) }
  catch(e){ $("#qrbox").style.display="none" }
}
window.addEventListener("load",()=>setTimeout(makeQR,600));
applyLang();
</script>
